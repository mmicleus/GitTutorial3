<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
    </nav>
    <h1>Gallery</h1>
    <p>A simple image gallery of cars.</p>
  </header>

  <main>
    <section class="gallery" aria-label="Car image gallery">
      <figure
        class="gallery-item"
        tabindex="0"
        role="button"
        aria-haspopup="dialog"
        data-name="BMW Coupe"
        data-make="BMW"
        data-year="2019"
        data-engine="3.0L Twin-Turbo I6"
        data-description="A sharp two-door coupe with balanced handling and everyday usability. Known for its precise steering and refined cabin."
      >
        <img
          src="https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800&q=80"
          alt="Blue BMW parked on a street"
          width="800"
          height="600"
        >
        <figcaption>
          BMW Coupe
          <span class="gallery-rating" aria-label="Your rating: not rated">Not rated</span>
        </figcaption>
      </figure>

      <figure
        class="gallery-item"
        tabindex="0"
        role="button"
        aria-haspopup="dialog"
        data-name="Classic Muscle"
        data-make="American Classic"
        data-year="1969"
        data-engine="V8"
        data-description="A timeless muscle car with bold lines and raw power. Built for straight-line speed and unmistakable road presence."
      >
        <img
          src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800&q=80"
          alt="Classic black muscle car"
          width="800"
          height="600"
        >
        <figcaption>
          Classic Muscle
          <span class="gallery-rating" aria-label="Your rating: not rated">Not rated</span>
        </figcaption>
      </figure>

      <figure
        class="gallery-item"
        tabindex="0"
        role="button"
        aria-haspopup="dialog"
        data-name="Porsche 911"
        data-make="Porsche"
        data-year="2020"
        data-engine="3.0L Twin-Turbo Flat-6"
        data-description="An iconic sports car with rear-engine layout and exceptional balance. Celebrated for its driving feel and everyday performance."
      >
        <img
          src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800&q=80"
          alt="Silver Porsche sports car"
          width="800"
          height="600"
        >
        <figcaption>
          Porsche 911
          <span class="gallery-rating" aria-label="Your rating: not rated">Not rated</span>
        </figcaption>
      </figure>

      <figure
        class="gallery-item"
        tabindex="0"
        role="button"
        aria-haspopup="dialog"
        data-name="Track Day"
        data-make="Performance Spec"
        data-year="2018"
        data-engine="High-output V8"
        data-description="A track-focused sports car set up for grip and speed. Aggressive styling matched with strong acceleration and braking."
      >
        <img
          src="https://images.unsplash.com/photo-1542362567-b07e54358753?w=800&q=80"
          alt="Red sports car on a track"
          width="800"
          height="600"
        >
        <figcaption>
          Track Day
          <span class="gallery-rating" aria-label="Your rating: not rated">Not rated</span>
        </figcaption>
      </figure>

      <figure
        class="gallery-item"
        tabindex="0"
        role="button"
        aria-haspopup="dialog"
        data-name="Luxury Sedan"
        data-make="Premium"
        data-year="2021"
        data-engine="3.0L Turbocharged"
        data-description="A comfortable executive sedan with a quiet cabin and refined ride. Designed for long journeys without sacrificing style."
      >
        <img
          src="https://images.unsplash.com/photo-1511919884225-912b6d9bd0f5?w=800&q=80"
          alt="White luxury sedan"
          width="800"
          height="600"
        >
        <figcaption>
          Luxury Sedan
          <span class="gallery-rating" aria-label="Your rating: not rated">Not rated</span>
        </figcaption>
      </figure>

      <figure
        class="gallery-item"
        tabindex="0"
        role="button"
        aria-haspopup="dialog"
        data-name="Mercedes-AMG"
        data-make="Mercedes-AMG"
        data-year="2022"
        data-engine="4.0L Twin-Turbo V8"
        data-description="An AMG performance model blending luxury with serious power. Sharp looks, strong soundtrack, and confident road manners."
      >
        <img
          src="https://images.unsplash.com/photo-1617531653332-bd46c24f7060?w=800&q=80"
          alt="Grey Mercedes-AMG car"
          width="800"
          height="600"
        >
        <figcaption>
          Mercedes-AMG
          <span class="gallery-rating" aria-label="Your rating: not rated">Not rated</span>
        </figcaption>
      </figure>
    </section>

    <section class="add-car" aria-labelledby="add-car-heading">
      <h2 id="add-car-heading">Add a car</h2>
      <p>Fill in the details below to add a new car to the gallery.</p>

      <form class="add-car-form" id="add-car-form">
        <div class="form-row">
          <div>
            <label for="car-name">Name</label>
            <input type="text" id="car-name" name="name" required maxlength="80" placeholder="e.g. Audi R8">
          </div>
          <div>
            <label for="car-make">Make</label>
            <input type="text" id="car-make" name="make" required maxlength="80" placeholder="e.g. Audi">
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="car-year">Year</label>
            <input type="number" id="car-year" name="year" required min="1886" max="2100" placeholder="e.g. 2023">
          </div>
          <div>
            <label for="car-engine">Engine</label>
            <input type="text" id="car-engine" name="engine" required maxlength="100" placeholder="e.g. 5.2L V10">
          </div>
        </div>

        <div>
          <label for="car-image">Image URL</label>
          <input type="url" id="car-image" name="imageUrl" required placeholder="https://example.com/car.jpg">
        </div>

        <div>
          <label for="car-description">Description</label>
          <textarea id="car-description" name="description" required maxlength="400" placeholder="A short description of the car"></textarea>
        </div>

        <div class="add-car-actions">
          <button type="submit">Add to gallery</button>
          <p class="add-car-status" id="add-car-status" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <div
    class="modal"
    id="car-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    hidden
  >
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel">
      <button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button>
      <img class="modal-image" id="modal-image" src="" alt="">
      <div class="modal-body">
        <h2 id="modal-title"></h2>
        <dl class="modal-details">
          <div>
            <dt>Make</dt>
            <dd id="modal-make"></dd>
          </div>
          <div>
            <dt>Year</dt>
            <dd id="modal-year"></dd>
          </div>
          <div>
            <dt>Engine</dt>
            <dd id="modal-engine"></dd>
          </div>
        </dl>
        <p id="modal-description"></p>

        <div class="rating" role="group" aria-labelledby="rating-label">
          <p id="rating-label" class="rating-label">Your rating</p>
          <div class="rating-stars" id="rating-stars">
            <button type="button" class="star" data-value="1" aria-label="1 star">★</button>
            <button type="button" class="star" data-value="2" aria-label="2 stars">★</button>
            <button type="button" class="star" data-value="3" aria-label="3 stars">★</button>
            <button type="button" class="star" data-value="4" aria-label="4 stars">★</button>
            <button type="button" class="star" data-value="5" aria-label="5 stars">★</button>
          </div>
          <p class="rating-value" id="rating-value">Not rated</p>
          <button type="button" class="rating-clear" id="rating-clear">Clear rating</button>
        </div>

        <div class="rent-car">
          <h3 class="rent-heading">Rent this car</h3>
          <p class="rent-current" id="rent-current" hidden></p>
          <form class="rent-form" id="rent-form">
            <div class="rent-fields">
              <div>
                <label for="rent-date">Date</label>
                <input type="date" id="rent-date" name="date" required>
              </div>
              <div>
                <label for="rent-time">Time</label>
                <input type="time" id="rent-time" name="time" required>
              </div>
            </div>
            <div class="rent-actions">
              <button type="submit">Book rental</button>
              <button type="button" class="rent-cancel" id="rent-cancel" hidden>Cancel booking</button>
            </div>
            <p class="rent-status" id="rent-status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Image gallery example</p>
  </footer>

  <script>
    (function () {
      const RATINGS_KEY = "car-gallery-ratings";
      const CUSTOM_CARS_KEY = "car-gallery-custom-cars";
      const BOOKINGS_KEY = "car-gallery-bookings";
      const gallery = document.querySelector(".gallery");
      const addCarForm = document.getElementById("add-car-form");
      const addCarStatus = document.getElementById("add-car-status");
      const modal = document.getElementById("car-modal");
      const modalImage = document.getElementById("modal-image");
      const modalTitle = document.getElementById("modal-title");
      const modalMake = document.getElementById("modal-make");
      const modalYear = document.getElementById("modal-year");
      const modalEngine = document.getElementById("modal-engine");
      const modalDescription = document.getElementById("modal-description");
      const ratingStars = document.getElementById("rating-stars");
      const ratingValue = document.getElementById("rating-value");
      const ratingClear = document.getElementById("rating-clear");
      const rentForm = document.getElementById("rent-form");
      const rentDate = document.getElementById("rent-date");
      const rentTime = document.getElementById("rent-time");
      const rentStatus = document.getElementById("rent-status");
      const rentCurrent = document.getElementById("rent-current");
      const rentCancel = document.getElementById("rent-cancel");
      const starButtons = ratingStars.querySelectorAll(".star");
      let lastFocused = null;
      let activeItem = null;

      function loadJson(key) {
        try {
          return JSON.parse(localStorage.getItem(key)) || {};
        } catch (error) {
          return {};
        }
      }

      function saveJson(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function loadRatings() {
        return loadJson(RATINGS_KEY);
      }

      function saveRatings(ratings) {
        saveJson(RATINGS_KEY, ratings);
      }

      function loadCustomCars() {
        try {
          const cars = JSON.parse(localStorage.getItem(CUSTOM_CARS_KEY));
          return Array.isArray(cars) ? cars : [];
        } catch (error) {
          return [];
        }
      }

      function saveCustomCars(cars) {
        localStorage.setItem(CUSTOM_CARS_KEY, JSON.stringify(cars));
      }

      function loadBookings() {
        return loadJson(BOOKINGS_KEY);
      }

      function saveBookings(bookings) {
        saveJson(BOOKINGS_KEY, bookings);
      }

      function getBooking(carName) {
        const booking = loadBookings()[carName];
        if (!booking || !booking.date || !booking.time) return null;
        return booking;
      }

      function setBooking(carName, booking) {
        const bookings = loadBookings();
        if (!booking) {
          delete bookings[carName];
        } else {
          bookings[carName] = booking;
        }
        saveBookings(bookings);
      }

      function todayIsoDate() {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        return now.getFullYear() + "-" + month + "-" + day;
      }

      function formatBookingLabel(booking) {
        const date = new Date(booking.date + "T" + booking.time);
        if (Number.isNaN(date.getTime())) {
          return booking.date + " at " + booking.time;
        }
        return date.toLocaleString(undefined, {
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function updateRentUI(carName) {
        const booking = getBooking(carName);
        rentForm.reset();
        rentDate.min = todayIsoDate();
        rentStatus.textContent = "";

        if (booking) {
          rentCurrent.hidden = false;
          rentCurrent.textContent = "Booked for " + formatBookingLabel(booking) + ".";
          rentDate.value = booking.date;
          rentTime.value = booking.time;
          rentCancel.hidden = false;
        } else {
          rentCurrent.hidden = true;
          rentCurrent.textContent = "";
          rentCancel.hidden = true;
        }
      }

      function getRating(carName) {
        const ratings = loadRatings();
        const value = Number(ratings[carName]);
        return Number.isInteger(value) && value >= 0 && value <= 5 ? value : 0;
      }

      function setRating(carName, value) {
        const ratings = loadRatings();
        if (value <= 0) {
          delete ratings[carName];
        } else {
          ratings[carName] = value;
        }
        saveRatings(ratings);
      }

      function isValidImageUrl(url) {
        try {
          const parsed = new URL(url);
          return parsed.protocol === "http:" || parsed.protocol === "https:";
        } catch (error) {
          return false;
        }
      }

      function formatRatingLabel(value) {
        if (value <= 0) return "Not rated";
        return value === 1 ? "1 star" : value + " stars";
      }

      function formatRatingDisplay(value) {
        if (value <= 0) return "Not rated";
        return "★".repeat(value) + "☆".repeat(5 - value) + " (" + value + "/5)";
      }

      function updateGalleryRating(item) {
        const value = getRating(item.dataset.name);
        const label = item.querySelector(".gallery-rating");
        if (!label) return;
        label.textContent = formatRatingDisplay(value);
        label.setAttribute("aria-label", "Your rating: " + formatRatingLabel(value).toLowerCase());
      }

      function paintStars(value) {
        starButtons.forEach(function (button) {
          const starValue = Number(button.dataset.value);
          const isActive = starValue <= value;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
        ratingValue.textContent = formatRatingLabel(value);
        ratingClear.hidden = value <= 0;
      }

      function openModal(item) {
        const img = item.querySelector("img");
        lastFocused = document.activeElement;
        activeItem = item;

        modalImage.src = img.src;
        modalImage.alt = img.alt;
        modalTitle.textContent = item.dataset.name;
        modalMake.textContent = item.dataset.make;
        modalYear.textContent = item.dataset.year;
        modalEngine.textContent = item.dataset.engine;
        modalDescription.textContent = item.dataset.description;
        paintStars(getRating(item.dataset.name));
        updateRentUI(item.dataset.name);

        modal.hidden = false;
        document.body.classList.add("modal-open");
        modal.querySelector(".modal-close").focus();
      }

      function closeModal() {
        modal.hidden = true;
        document.body.classList.remove("modal-open");
        modalImage.removeAttribute("src");
        rentStatus.textContent = "";
        activeItem = null;
        if (lastFocused) lastFocused.focus();
      }

      function bindGalleryItem(item) {
        if (item.dataset.bound === "true") return;
        item.dataset.bound = "true";

        updateGalleryRating(item);

        item.addEventListener("click", function () {
          openModal(item);
        });

        item.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openModal(item);
          }
        });
      }

      function createGalleryItem(car) {
        const figure = document.createElement("figure");
        figure.className = "gallery-item";
        figure.tabIndex = 0;
        figure.setAttribute("role", "button");
        figure.setAttribute("aria-haspopup", "dialog");
        figure.dataset.name = car.name;
        figure.dataset.make = car.make;
        figure.dataset.year = String(car.year);
        figure.dataset.engine = car.engine;
        figure.dataset.description = car.description;

        const img = document.createElement("img");
        img.src = car.imageUrl;
        img.alt = car.alt || car.name;
        img.width = 800;
        img.height = 600;

        const figcaption = document.createElement("figcaption");
        figcaption.appendChild(document.createTextNode(car.name));

        const rating = document.createElement("span");
        rating.className = "gallery-rating";
        rating.setAttribute("aria-label", "Your rating: not rated");
        rating.textContent = "Not rated";
        figcaption.appendChild(rating);

        figure.appendChild(img);
        figure.appendChild(figcaption);
        return figure;
      }

      function carNameExists(name) {
        const existing = gallery.querySelectorAll(".gallery-item");
        return Array.prototype.some.call(existing, function (item) {
          return item.dataset.name.toLowerCase() === name.toLowerCase();
        });
      }

      function addCarToGallery(car, persist) {
        const item = createGalleryItem(car);
        gallery.appendChild(item);
        bindGalleryItem(item);

        if (persist) {
          const cars = loadCustomCars();
          cars.push(car);
          saveCustomCars(cars);
        }
      }

      document.querySelectorAll(".gallery-item").forEach(bindGalleryItem);

      loadCustomCars().forEach(function (car) {
        if (!car || !car.name || carNameExists(car.name)) return;
        addCarToGallery(car, false);
      });

      addCarForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const formData = new FormData(addCarForm);
        const car = {
          name: String(formData.get("name") || "").trim(),
          make: String(formData.get("make") || "").trim(),
          year: Number(formData.get("year")),
          engine: String(formData.get("engine") || "").trim(),
          description: String(formData.get("description") || "").trim(),
          imageUrl: String(formData.get("imageUrl") || "").trim(),
          alt: String(formData.get("name") || "").trim()
        };

        if (!car.name || !car.make || !car.engine || !car.description) {
          addCarStatus.textContent = "Please fill in all fields.";
          return;
        }

        if (!Number.isInteger(car.year) || car.year < 1886 || car.year > 2100) {
          addCarStatus.textContent = "Enter a valid year.";
          return;
        }

        if (!isValidImageUrl(car.imageUrl)) {
          addCarStatus.textContent = "Enter a valid http or https image URL.";
          return;
        }

        if (carNameExists(car.name)) {
          addCarStatus.textContent = "A car with that name is already in the gallery.";
          return;
        }

        addCarToGallery(car, true);
        addCarForm.reset();
        addCarStatus.textContent = car.name + " added to the gallery.";
      });

      ratingStars.addEventListener("click", function (event) {
        const button = event.target.closest(".star");
        if (!button || !activeItem) return;

        const nextValue = Number(button.dataset.value);
        const currentValue = getRating(activeItem.dataset.name);
        const value = currentValue === nextValue ? 0 : nextValue;

        setRating(activeItem.dataset.name, value);
        paintStars(value);
        updateGalleryRating(activeItem);
      });

      ratingClear.addEventListener("click", function () {
        if (!activeItem) return;
        setRating(activeItem.dataset.name, 0);
        paintStars(0);
        updateGalleryRating(activeItem);
      });

      rentForm.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!activeItem) return;

        const date = rentDate.value;
        const time = rentTime.value;

        if (!date || !time) {
          rentStatus.textContent = "Choose a date and time.";
          return;
        }

        const bookedAt = new Date(date + "T" + time);
        if (Number.isNaN(bookedAt.getTime())) {
          rentStatus.textContent = "Enter a valid date and time.";
          return;
        }

        if (bookedAt.getTime() < Date.now()) {
          rentStatus.textContent = "Choose a future date and time.";
          return;
        }

        setBooking(activeItem.dataset.name, { date: date, time: time });
        updateRentUI(activeItem.dataset.name);
        rentStatus.textContent = "Rental booked for " + formatBookingLabel({ date: date, time: time }) + ".";
      });

      rentCancel.addEventListener("click", function () {
        if (!activeItem) return;
        setBooking(activeItem.dataset.name, null);
        updateRentUI(activeItem.dataset.name);
        rentStatus.textContent = "Booking cancelled.";
      });

      modal.addEventListener("click", function (event) {
        if (event.target.closest("[data-close-modal]")) {
          closeModal();
        }
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !modal.hidden) {
          closeModal();
        }
      });
    })();
  </script>
</body>
</html>
