<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
    </nav>
    <h1>Gallery</h1>
    <p>A simple image gallery of cars.</p>
  </header>

  <main>
    <section class="gallery" aria-label="Car image gallery">
      <figure>
        <img
          src="https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800&q=80"
          alt="Blue BMW parked on a street"
          width="800"
          height="600"
        >
        <figcaption>BMW Coupe</figcaption>
      </figure>

      <figure>
        <img
          src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=800&q=80"
          alt="Classic black muscle car"
          width="800"
          height="600"
        >
        <figcaption>Classic Muscle</figcaption>
      </figure>

      <figure>
        <img
          src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800&q=80"
          alt="Silver Porsche sports car"
          width="800"
          height="600"
        >
        <figcaption>Porsche 911</figcaption>
      </figure>

      <figure>
        <img
          src="https://images.unsplash.com/photo-1542362567-b07e54358753?w=800&q=80"
          alt="Red sports car on a track"
          width="800"
          height="600"
        >
        <figcaption>Track Day</figcaption>
      </figure>

      <figure>
        <img
          src="https://s1.cdn.autoevolution.com/images/news/mercedes-maybach-s-580-rs-edition-is-white-all-over-but-also-just-a-little-black-189187_1.jpg"
          alt="White luxury sedan"
          width="800"
          height="600"
        >
        <figcaption>Luxury Sedan</figcaption>
      </figure>

      <figure>
        <img
          src="https://www.topgear.com/sites/default/files/2025/04/DSC_2857-Edit-2.jpg"
          alt="Grey Mercedes-AMG car"
          width="800"
          height="600"
        >
        <figcaption>Nissan GTR</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>Image gallery example</p>
  </footer>
</body>
</html>
